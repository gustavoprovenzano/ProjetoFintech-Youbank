<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao Youbank</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="conteudo-central">
        <div class="boas-vindas">
            <h1>Olá ! Colaborador(a)<br><span>Youbank</span></h1>
            <p>Faça seu login para acessar o sistema.</p>
        </div>

        <div class="containerLogin">
            <form action="" method="post" id="formLogin">
                <input type="text" name="usuarioCPF" id="usuarioCPF" placeholder="CPF (Apenas Números)" required
                    maxlength="11">
                <input type="password" name="senha" id="senha" placeholder="Senha" required>
                <input type="submit" value="Acessar" id="btnEntrar">
                <input type="button" id="btnCriarConta" value="Primeiro Acesso? Criar Conta">
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Youbank Instituição Financeira - Projeto Acadêmico</p>
    </footer>

    <script src="index.js"></script>
</body>

</html>
