<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Youbank</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <main class="conteudo-central">
        <div class="boas-vindas">
            <h1>Cadastro colaborador(a)<br><span>Youbank</span></h1>
            <p>Gerencia seus negocios.</p>
        </div>

        <div class="containerLogin">
            <form id="cadastroForm">
                <input type="text" name="nome" id="cadastroNome" placeholder="Nome completo" required>
                <input type="text" name="cpf" id="cadastroUsuarioCPF" placeholder="CPF (apenas números)" required maxlength="11">
                <input type="password" name="senha" id="cadastroSenha" placeholder="Senha" required>
                <input type="submit" value="Cadastrar" id="btnEntrar">
                <input type="button" id="btnVoltar" value="Voltar ao Login">
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Youbank Instituição Financeira - Projeto Acadêmico</p>
    </footer>

    <script src="cadastro.js"></script>
  </body>

</html>
